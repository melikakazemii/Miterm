<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FashionHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="FashionHub">
      <div class="FashionHub-ful">
        <div class="FashionHub-logo">
          <img src="assets/img/logo.png" alt="" />
        </div>
        <nav class="FashionHub-nav">
          <a href="#">Category</a>
          <a href="">Brand</a>
          <a href="">Contact</a>
          <a href="">FAQ</a>
        </nav>
      </div>
      <div class="FashionHub-btn">
        <button class="btn-header btn-bag" aria-label="shoop" type="button">
          <img src="assets/icon/bag-brown.svg" alt="" />
        </button>
        <!-- <img src="assets/icon/1.svg" alt="" /> -->
        <button class="btn-header btn-notif" aria-label="notif" type="button">
          <img src="assets/icon/notification.svg" />
        </button>
        <img class="user1" src="assets/img/user-1.png" />
        <div class="texts">
          <span>Good Morning!</span>
          <h2>Scarlet Johnson</h2>
        </div>
      </div>
    </header>
   
    <div class="hero">
      <div class="hero-imgs">
        <div class="product-1">
          <img src="assets/img/product-1.png" alt="" />
        </div>
        <div class="products">
          <img src="assets/img/product-2.png" alt="" />
          <img src="assets/img/product-3.png" alt="" />
          <img src="assets/img/product-4.png" alt="" />
          <img src="assets/img/product-5.png" alt="" />
        </div>
      </div>
      <div class="hero-Dress">
        <div class="home">
          <span>Home</span>
          <img src="assets/icon/arrow-right.svg" alt="" />
          <span>Fashion</span>
          <img src="assets/icon/arrow-right.svg" alt="" />
          <span>Products</span>
          <img src="assets/icon/arrow-right.svg" alt="" />
          <span>Skirts</span>
          <img src="assets/icon/arrow-right.svg" alt="" />
          <span>Coast Dress</span>
        </div>
        <div class="Coast">
          <div class="Coast-Dress">
            <h1>Coast Dress</h1>
            <p>Breezy, versatile, seaside ready style</p>
          </div>
          <div class="Coast-Dress">
            <button class="btn-like" type="button">
              <img src="assets/icon/heart.svg" alt="" /> <span>109</span>
            </button>
            <button class="btn-arshive" type="button">
              <img src="assets/icon/archive.svg" alt="" />
            </button>
            <button class="btn-share" type="button">
              <img src="assets/icon/share.svg" alt="" />
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
